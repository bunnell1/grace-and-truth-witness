<main>
  <h1>Growth Modules</h1>
  <p class="note">Listening well, gospel clarity, handling rejection, sovereignty and responsibility.</p>
  <div id="module-list"></div>
  <div id="module-detail" class="hidden card"></div>
</main>
<footer>
  <a href="https://graceandtruthministry.com">Grace & Truth Ministry</a>
  <p>© 2026 Grace & Truth Witness</p>
</footer>
<div id="verse-tip" class="verse-tip"></div>
<script>
const ESV_TOKEN = 'ac58562b92f736c651dad88a83c98661ac1887ea';
const verseCache = {};

function renderModules() {
  const list = document.getElementById('module-list');
  list.innerHTML = '';
  (modules || []).forEach(m => {
    const div = document.createElement('div');
    div.className = 'situation-item';
    div.innerHTML = `<strong>${m.title}</strong><p>${m.summary || ''}</p>`;
    div.onclick = () => showModule(m);
    list.appendChild(div);
  });
}

function showModule(m) {
  const detail = document.getElementById('module-detail');
  const notesKey = 'mod-notes-' + m.id;
  const saved = localStorage.getItem(notesKey) || '';
  let why = '';
  if (m.why) {
    why = `<div class="note" style="margin:1rem 0;"><strong>Why this approach works</strong><p>${m.why}</p></div>`;
  }
  let scriptures = '';
  if (m.scriptures && m.scriptures.length) {
    scriptures = '<h3>Scriptures</h3><ul>' + m.scriptures.map(s => `<li><span class="verse-ref" data-ref="${s}">${s}</span></li>`).join('') + '</ul>';
  }
  let reading = '';
  if (m.furtherReading && m.furtherReading.length) {
    reading = '<h3>For Further Reading</h3><ul>' + m.furtherReading.map(b => `<li><a href="${b.url}" target="_blank" rel="noopener">${b.title}</a></li>`).join('') + '</ul>';
  }
  let homework = '';
  if (m.homework) {
    homework = '<h3>Homework to Grow</h3><ul>' + m.homework.map(h => `<li>${h}</li>`).join('') + '</ul>';
  }
  detail.innerHTML = `
    <h2>${m.title}</h2>
    <p>${m.summary || ''}</p>
    <p>${m.content || ''}</p>
    ${why}
    ${scriptures}
    ${homework}
    ${reading}
    <h3>Your Notes</h3>
    <textarea class="notes-area" id="mod-notes" placeholder="Notes stay on this device">${saved}</textarea>
    <div class="icon-row">
      <button class="icon-btn" title="Back" onclick="hideDetail()">←</button>
      <button class="icon-btn" title="Save" onclick="saveNotes('${notesKey}')">✓</button>
      <button class="icon-btn" title="Clear" onclick="if(confirm('Clear notes?')) clearNotes('${notesKey}')">✕</button>
    </div>
  `;
  detail.classList.remove('hidden');
  document.getElementById('module-list').classList.add('hidden');
  bindVerseHovers();
}

function hideDetail() {
  document.getElementById('module-detail').classList.add('hidden');
  document.getElementById('module-list').classList.remove('hidden');
}

function saveNotes(key) {
  localStorage.setItem(key, document.getElementById('mod-notes').value);
  alert('Saved');
}
function clearNotes(key) {
  document.getElementById('mod-notes').value = '';
  localStorage.removeItem(key);
}

function bindVerseHovers() {
  const tip = document.getElementById('verse-tip');
  document.querySelectorAll('.verse-ref').forEach(el => {
    el.addEventListener('mouseenter', async (e) => {
      const ref = el.dataset.ref;
      if (!ref) return;
      tip.innerHTML = '<div class="vt-ref">' + ref + '</div><div class="vt-text">Loading…</div>';
      tip.classList.add('show');
      positionTip(e);
      if (verseCache[ref]) {
        tip.querySelector('.vt-text').textContent = verseCache[ref];
        return;
      }
      try {
        const url = 'https://api.esv.org/v3/passage/text/?q=' + encodeURIComponent(ref) + '&include-headings=false&include-footnotes=false&include-verse-numbers=false&include-short-copyright=false&include-passage-references=false';
        const res = await fetch(url, { headers: { Authorization: 'Token ' + ESV_TOKEN } });
        const data = await res.json();
        const text = (data.passages && data.passages[0]) || 'Passage not found.';
        verseCache[ref] = text;
        tip.querySelector('.vt-text').textContent = text;
      } catch (err) {
        tip.querySelector('.vt-text').textContent = 'Could not load verse.';
      }
    });
    el.addEventListener('mousemove', positionTip);
    el.addEventListener('mouseleave', () => tip.classList.remove('show'));
    el.addEventListener('click', (e) => {
      e.preventDefault();
      window.open('https://www.esv.org/' + encodeURIComponent(el.dataset.ref), '_blank');
    });
  });
}

function positionTip(e) {
  const tip = document.getElementById('verse-tip');
  tip.style.left = (e.clientX + 12) + 'px';
  tip.style.top = (e.clientY + 12) + 'px';
}

renderModules();
const params = new URLSearchParams(location.search);
const openId = params.get('id');
if (openId) {
  const item = (modules || []).find(m => m.id === openId);
  if (item) showModule(item);
}

(function () {
  function icon() {
    var el = document.getElementById('theme-icon');
    if (!el) return;
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    el.innerHTML = dark
      ? '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>'
      : '<path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>';
  }
  function bind() {
    icon();
    var btn = document.getElementById('theme-toggle');
    if (!btn || btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      icon();
    });
  }
  var saved = localStorage.getItem('theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
})();
</script>
</body>
</html>
