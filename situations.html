<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Situations | Grace & Truth Witness</title>
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data.js"></script>
</head>
<body>
<header>
  <div class="header-inner">
    <a href="index.html" class="brand">
      <img src="logo.png" alt="" class="brand-logo">
      <div>
        <span class="brand-name">Grace & Truth Witness</span>
        <span class="brand-sub">Share the Gospel</span>
      </div>
    </a>
    <nav>
      <a href="index.html">Home</a>
      <a href="situations.html" class="active">Situations</a>
      <a href="modules.html">Growth</a>
      <a href="toolkit.html">Toolkit</a>
      <a href="scripture.html">Scripture</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>
<main>
  <h1>Situations & Things People Say</h1>
  <p class="note">Search by what people say. Applicable Scripture, biblical principles, and sample response directions.</p>
  <div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem;">
    <input type="text" id="search" class="search-box" placeholder="Describe what they said or the situation…" style="margin:0;flex:1;">
    <button class="btn" onclick="doSearch()">Find</button>
  </div>
  <div id="situation-list"></div>
  <div id="situation-detail" class="hidden card"></div>
</main>
<footer>
  <a href="https://graceandtruthministry.com">Grace & Truth Ministry</a>
  <p>© 2026 Grace & Truth Witness</p>
</footer>
<script>
const SUPABASE_URL = 'https://nvxtvwdvvzhbsvbpnlgz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_U511agudgV1tcFiEIIGbFg_EPDltBn3';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function renderSituations(filter = '', aiIds = null) {
  const list = document.getElementById('situation-list');
  list.innerHTML = '';
  let items = (typeof situations !== 'undefined' ? situations : []);
  if (aiIds && aiIds.length) {
    items = items.filter(i => aiIds.includes(i.id));
  } else if (filter) {
    const f = filter.toLowerCase();
    items = items.filter(i => (i.title || '').toLowerCase().includes(f) || (i.principles || '').toLowerCase().includes(f));
  }
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'situation-item';
    div.innerHTML = `<strong>${item.title}</strong><p>${item.principles ? item.principles.slice(0, 120) + '...' : ''}</p>`;
    div.onclick = () => showSituation(item);
    list.appendChild(div);
  });
  if (!items.length) list.innerHTML = '<p class="note">No matching situations.</p>';
}

function showSituation(item) {
  const detail = document.getElementById('situation-detail');
  detail.innerHTML = `<h2>${item.title}</h2><p>${item.principles || ''}</p><button class="btn" onclick="hideDetail()">Back</button>`;
  detail.classList.remove('hidden');
  document.getElementById('situation-list').classList.add('hidden');
}

function hideDetail() {
  document.getElementById('situation-detail').classList.add('hidden');
  document.getElementById('situation-list').classList.remove('hidden');
}

async function doSearch() {
  const q = document.getElementById('search').value.trim();
  if (!q) { renderSituations(); return; }
  const list = document.getElementById('situation-list');
  list.innerHTML = '<p class="note">Searching…</p>';
  try {
    const catalog = (situations || []).map(s => ({ type: 'situation', id: s.id, title: s.title, summary: s.principles || '' }));
    const { data, error } = await sb.functions.invoke('find', { body: { q, catalog } });
    if (!error && data && data.matches && data.matches.length) {
      const ids = data.matches.map(m => m.id).filter(Boolean);
      renderSituations(q, ids);
      return;
    }
  } catch (e) { console.error(e); }
  renderSituations(q);
}

document.getElementById('search').addEventListener('input', e => renderSituations(e.target.value));
document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
renderSituations();
</script>
</body>
</html>
