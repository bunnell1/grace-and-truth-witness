</header>
<main>
  <h1>Situations & Things People Say</h1>
  <p class="note">Search by what people say. Applicable Scripture, biblical principles, and sample response directions.</p>
  <div style="display:flex;gap:0.5rem;align-items:center;margin-bottom:1rem;">
    <input type="text" id="search" class="search-box" placeholder="Describe what they said or the situation…" style="margin:0;flex:1;">
    <button class="btn" onclick="doSearch()">Find</button>
  </div>
  <div id="situation-list"></div>
  <div id="situation-detail" class="hidden card"></div>
</main>
<footer>
  <a href="https://graceandtruthministry.com">Grace & Truth Ministry</a>
  <p>© 2026 Grace & Truth Witness</p>
</footer>
<script>
const SUPABASE_URL = 'https://nvxtvwdvvzhbsvbpnlgz.supabase.co';
const SUPABASE_KEY = 'sb_publishable_U511agudgV1tcFiEIIGbFg_EPDltBn3';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function renderSituations(filter = '', aiIds = null) {
  const list = document.getElementById('situation-list');
  list.innerHTML = '';
  let items = (typeof situations !== 'undefined' ? situations : []);
  if (aiIds && aiIds.length) {
    items = items.filter(i => aiIds.includes(i.id));
  } else if (filter) {
    const f = filter.toLowerCase();
    items = items.filter(i => (i.title || '').toLowerCase().includes(f) || (i.principles || '').toLowerCase().includes(f));
  }
  items.forEach(item => {
    const div = document.createElement('div');
    div.className = 'situation-item';
    div.innerHTML = `<strong>${item.title}</strong><p>${item.principles ? item.principles.slice(0, 140) + '...' : ''}</p>`;
    div.onclick = () => showSituation(item);
    list.appendChild(div);
  });
  if (!items.length) list.innerHTML = '<p class="note">No matching situations.</p>';
}

function showSituation(item) {
  const detail = document.getElementById('situation-detail');
  const notesKey = 'sit-notes-' + item.id;
  const saved = localStorage.getItem(notesKey) || '';
  let scriptures = '';
  if (item.scriptures && item.scriptures.length) {
    scriptures = '<h3>Key Scriptures</h3><ul>' + item.scriptures.map(s => `<li>${s}</li>`).join('') + '</ul>';
  }
  let responses = '';
  if (item.responses && item.responses.length) {
    responses = '<h3>Sample Response Directions</h3><ul>' + item.responses.map(r => `<li>${r}</li>`).join('') + '</ul>';
  }
  let reading = '';
  if (item.furtherReading && item.furtherReading.length) {
    reading = '<h3>For Further Reading</h3><ul>' + item.furtherReading.map(b => `<li><a href="${b.url}" target="_blank" rel="noopener">${b.title}</a></li>`).join('') + '</ul>';
  }
  detail.innerHTML = `
    <h2>${item.title}</h2>
    <h3>Biblical Principles</h3>
    <p>${item.principles || ''}</p>
    ${scriptures}
    ${responses}
    ${reading}
    <h3>Your Notes</h3>
    <textarea class="notes-area" id="sit-notes" placeholder="Notes stay on this device">${saved}</textarea>
    <div class="icon-row">
      <button class="icon-btn" title="Back" onclick="hideDetail()">←</button>
      <button class="icon-btn" title="Save" onclick="saveNotes('${notesKey}')">✓</button>
      <button class="icon-btn" title="Download" onclick="downloadNotes('${notesKey}', '${item.title}')">↓</button>
      <button class="icon-btn" title="Upload" onclick="document.getElementById('upload-notes').click()">↑</button>
      <input type="file" id="upload-notes" accept=".txt" style="display:none" onchange="uploadNotes('${notesKey}', this)">
      <button class="icon-btn" title="Clear" onclick="if(confirm('Clear notes?')) clearNotes('${notesKey}')">✕</button>
      <button class="icon-btn" title="Print" onclick="window.print()">⎙</button>
    </div>
  `;
  detail.classList.remove('hidden');
  document.getElementById('situation-list').classList.add('hidden');
}

function hideDetail() {
  document.getElementById('situation-detail').classList.add('hidden');
  document.getElementById('situation-list').classList.remove('hidden');
}

function saveNotes(key) {
  localStorage.setItem(key, document.getElementById('sit-notes').value);
  alert('Saved');
}
function downloadNotes(key, title) {
  const val = document.getElementById('sit-notes').value;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([val], {type:'text/plain'}));
  a.download = (title || 'notes') + '-notes.txt';
  a.click();
}
function uploadNotes(key, input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    document.getElementById('sit-notes').value = reader.result;
    localStorage.setItem(key, reader.result);
  };
  reader.readAsText(file);
}
function clearNotes(key) {
  document.getElementById('sit-notes').value = '';
  localStorage.removeItem(key);
}

async function doSearch() {
  const q = document.getElementById('search').value.trim();
  if (!q) { renderSituations(); return; }
  const list = document.getElementById('situation-list');
  list.innerHTML = '<p class="note">Searching…</p>';
  try {
    const catalog = (situations || []).map(s => ({ type: 'situation', id: s.id, title: s.title, summary: s.principles || '' }));
    const { data, error } = await sb.functions.invoke('find', { body: { q, catalog } });
    if (!error && data && data.matches && data.matches.length) {
      const ids = data.matches.map(m => m.id).filter(Boolean);
      renderSituations(q, ids);
      return;
    }
  } catch (e) { console.error(e); }
  renderSituations(q);
}

document.getElementById('search').addEventListener('input', e => renderSituations(e.target.value));
document.getElementById('search').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
renderSituations();

(function () {
  function icon() {
    var el = document.getElementById('theme-icon');
    if (!el) return;
    var dark = document.documentElement.getAttribute('data-theme') === 'dark';
    el.innerHTML = dark
      ? '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6 17 7M7 17l-1.4 1.4"/>'
      : '<path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/>';
  }
  function bind() {
    icon();
    var btn = document.getElementById('theme-toggle');
    if (!btn || btn.dataset.bound) return;
    btn.dataset.bound = '1';
    btn.addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      icon();
    });
  }
  var saved = localStorage.getItem('theme');
  if (saved) document.documentElement.setAttribute('data-theme', saved);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', bind);
  else bind();
})();
</script>
</body>
</html>
